# Working papers. They appear on the Research page (newest first) and as questions on the home page.
#
# To add a paper: copy one block below, paste it at the top, and change the values.
#   - Keep the two-space indentation and the dash in front of "key".
#   - Put text in "double quotes" (titles contain colons, which YAML would otherwise misread).
#   - posted is the SSRN posting date as YYYY-MM-DD; the site shows the month and year. Leave pages empty if you don't want to show it.
#   - anchor is the section on frameworks.html the home-page question links to.

- key: eagi
  title: "What Public Disclosure Cannot Measure: Enterprise-Architecture Governance, the Failure of a Voluntary-Text Instrument, and a Mandatory-Disclosure Alternative"
  ssrn: 7654858
  posted: 2026-10-23
  pages: 40
  framework: Governance Observability Ladder
  anchor: eagi
  question: "Can enterprise-architecture governance be measured from what firms disclose?"
  summary: "Tests whether enterprise-architecture governance can be read from public disclosure, across 950 firm-years of 167 large US filers from 2019 to 2025. A voluntary-text index fails while the same method works on AI vocabulary, so the paper orders disclosure sources by regulatory compulsion and attestation in a Governance Observability Ladder. As an exploratory result, firms with a more disciplined core disclose more AI adoption the following year; governance disclosure does not predict it."
  tool: https://felixdlanger.github.io/eagi-research/
  tool_name: TRVA Navigator

- key: tave
  title: "Tokenization and the Cost of Capital: A Five-Channel Valuation Framework with Event-Study and Practitioner Evidence"
  ssrn: 7463278
  posted: 2026-09-17
  pages: 41
  framework: Tokenized Asset Valuation Engine
  anchor: tave
  question: "What does tokenizing an asset do to its cost of capital?"
  summary: "Models how tokenizing enterprise assets changes a firm’s cost of capital through five channels, liquidity among them, and tests the framework with an event study of tokenization announcements and practitioner evidence."
