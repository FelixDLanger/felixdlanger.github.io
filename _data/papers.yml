  tool_name: TAVE

- key: core-integrity
  title: "Core Integrity as a Firm Characteristic: Allocation, Level, and the Limits of Public-Data Inference on Architectural Discipline"
  ssrn: 7445559
  posted: 2026-09-12
  pages: 29
  framework: Core Integrity Adherence–Outcome Framework
  anchor: core-integrity
  question: "Does architectural discipline show up in a firm’s results?"
  summary: "Tests whether firms that keep their core enterprise platform standard and integrate through governed interfaces perform better, using 167 large US filers from 2019 to 2025. The evidence does not support a general rule: the right level of discipline is firm-specific and can’t be read from pooled public data."
  tool: https://felixdlanger.github.io/eagi-research/
  tool_name: TRVA Navigator

- key: cvm
  title: "The Concentric Value Model - A Modern Framework for Evaluating Public Companies and Stock Price Performance for Contemporary Capital Markets"
  ssrn: 6846940
  posted: 2026-06-15
  pages: 35
  framework: Concentric Value Model
  anchor: concentric-value-model
  question: "Which companies are worth owning when most of their value is intangible?"
  summary: "Adapts Graham-style value investing to intangible-heavy, derivatives-influenced markets with a six-layer, ten-dimension model, tested on 200 large caps from 2016 to 2025. It works best as a sector-quality classifier rather than as a stand-alone stock-selection signal."
  tool: https://felixdlanger.github.io/Concentric_Value_Model/
  tool_name: Concentric Value Model

- key: singapore-swf
  title: "Singapore’s Sovereign Wealth Strategy: A Cointegration Analysis of GDP, Net Investment Returns Contribution, and Fiscal Sustainability (1994-2023)"
  ssrn: 6794701
  posted: 2026-05-29
  pages: 48
  framework: Fiscal Infrastructure Ladder
  anchor: fiscal-infrastructure-ladder
  question: "Is Singapore’s reserve income a fiscal multiplier, or infrastructure?"
  summary: "Finds a long-run relationship between Singapore’s real GDP, the Net Investment Returns Contribution from its reserves, and population over 1994 to 2023, with about 55% of any deviation corrected within a year, and argues the NIRC works as fiscal infrastructure rather than as a fiscal multiplier."
